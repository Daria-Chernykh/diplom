<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PopCulture Events — Вход</title>
  <style>
    :root{
      --surface:#ffffff;
      --border:#d7deea;
      --text:#172033;
      --muted:#667085;
      --primary:#4f46e5;
      --primary-dark:#4338ca;
      --brand:#7c3aed;
      --shadow:0 10px 30px rgba(17,24,39,.08);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, rgba(79,70,229,.12), transparent 30%),
        linear-gradient(180deg,#eef2ff 0%,#f4f6fb 100%);
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      min-height:calc(100vh - 79px);
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:520px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel{
      padding:36px;
    }

    .brand{
      font-weight:700;
      font-size:20px;
      margin-bottom:24px;
      color:var(--brand);
    }

    .title{
      margin-bottom:20px;
    }

    .title h1{
      margin:0 0 8px;
      font-size:28px;
    }

    .title span{
      color:var(--muted);
      font-size:14px;
    }

    .form{
      display:grid;
      gap:16px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:700;
    }

    .field input{
      width:100%;
      min-height:48px;
      border-radius:14px;
      border:1px solid var(--border);
      padding:0 14px;
      font-size:14px;
      outline:none;
      background:#fff;
    }

    .btn{
      min-height:48px;
      border:0;
      border-radius:14px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      width:100%;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
      box-shadow:0 10px 20px rgba(79,70,229,.24);
    }

    .alt{
      margin-top:18px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }

    .alt a{
      color:var(--primary-dark);
      font-weight:700;
    }


    .site-header{
      background:rgba(255,255,255,.92);
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(10px);
    }

    .site-header-inner{
      max-width:1280px;
      margin:0 auto;
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      flex-wrap:wrap;
    }

    .site-brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      font-size:20px;
      color:var(--text);
    }

    .site-nav{
      display:flex;
      gap:18px;
      color:var(--muted);
      font-size:14px;
      flex-wrap:wrap;
    }

    .site-nav a:hover{
      color:var(--primary);
    }

    .site-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .site-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid transparent;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      font-family:inherit;
      text-align:center;
    }

    .site-btn-outline{
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }

    .site-btn-primary{
      background:var(--primary);
      color:#fff;
      box-shadow:0 8px 20px rgba(79,70,229,.24);
    }

    @media (max-width:520px){
      .page{
        padding:12px;
      }

      .panel{
        padding:24px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">PopCulture Events</div>

      <nav class="site-nav">
        <a href="#">Главная</a>
        <a href="#">Каталог</a>
        <a href="#">Документы</a>
      </nav>

      <div class="site-actions">
        <a class="site-btn site-btn-primary" href="#">Регистрация</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <div class="panel">

        <div class="title">
          <h1>Вход</h1>
          <span>Введите данные для входа в учетную запись</span>
        </div>

        <form class="form">
          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" placeholder="name@example.com" />
          </div>

          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" type="password" placeholder="Введите пароль" />
          </div>

          <button class="btn btn-primary" type="button">Войти</button>
        </form>

        <div class="alt">
          Нет аккаунта? <a href="#">Зарегистрироваться</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
