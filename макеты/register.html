<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PopCulture Events — Регистрация</title>
  <style>
    :root{
      --surface:#ffffff;
      --border:#d7deea;
      --text:#172033;
      --muted:#667085;
      --primary:#4f46e5;
      --primary-dark:#4338ca;
      --brand:#7c3aed;
      --shadow:0 10px 30px rgba(17,24,39,.08);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(79,70,229,.12), transparent 24%),
        linear-gradient(180deg,#eef2ff 0%,#f4f6fb 100%);
      min-height:100vh;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      min-height:calc(100vh - 79px);
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:520px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .panel{
      padding:36px;
    }

    .brand{
      margin-bottom:24px;
      font-weight:700;
      font-size:20px;
      color:var(--brand);
    }

    .title{
      margin-bottom:20px;
    }

    .title h1{
      margin:0 0 8px;
      font-size:28px;
    }

    .title span{
      color:var(--muted);
      font-size:14px;
    }

    .form{
      display:grid;
      gap:14px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:700;
    }

    .field input,
    .field select{
      width:100%;
      min-height:48px;
      border-radius:14px;
      border:1px solid var(--border);
      padding:0 14px;
      font-size:14px;
      outline:none;
      background:#fff;
    }

    .hint{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      margin-top:6px;
    }

    .terms{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:4px;
    }

    .terms-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      font-size:13px;
      line-height:1.5;
    }

    .terms-links a{
      color:var(--primary-dark);
      font-weight:700;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    .check{
      display:flex;
      align-items:flex-start;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .btn{
      min-height:48px;
      border:0;
      border-radius:14px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      width:100%;
      margin-top:6px;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
      box-shadow:0 10px 20px rgba(79,70,229,.24);
    }

    .alt{
      margin-top:18px;
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }

    .alt a{
      color:var(--primary-dark);
      font-weight:700;
    }


    .site-header{
      background:rgba(255,255,255,.92);
      border-bottom:1px solid var(--border);
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(10px);
    }

    .site-header-inner{
      max-width:1280px;
      margin:0 auto;
      padding:18px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      flex-wrap:wrap;
    }

    .site-brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      font-size:20px;
      color:var(--text);
    }

    .site-nav{
      display:flex;
      gap:18px;
      color:var(--muted);
      font-size:14px;
      flex-wrap:wrap;
    }

    .site-nav a:hover{
      color:var(--primary);
    }

    .site-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .site-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:42px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid transparent;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      font-family:inherit;
      text-align:center;
    }

    .site-btn-outline{
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }

    .site-btn-primary{
      background:var(--primary);
      color:#fff;
      box-shadow:0 8px 20px rgba(79,70,229,.24);
    }


    .legal-check{
      display:flex;
      align-items:flex-start;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .legal-check input{
      margin-top:2px;
      accent-color:var(--primary);
    }

    .legal-check a,
    .check a,
    .complaint-note a,
    .review-note a{
      color:var(--primary-dark);
      font-weight:700;
      text-decoration:underline;
      text-underline-offset:2px;
    }

    @media (max-width:520px){
      .page{
        padding:12px;
      }

      .panel{
        padding:24px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-brand">PopCulture Events</div>

      <nav class="site-nav">
        <a href="#">Главная</a>
        <a href="#">Каталог</a>
        <a href="#">Документы</a>
      </nav>

      <div class="site-actions">
        <a class="site-btn site-btn-outline" href="#">Вход</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <div class="panel">

        <div class="title">
          <h1>Регистрация</h1>
          <span>Заполните данные для создания новой учетной записи</span>
        </div>

        <form class="form">
          <div class="field">
            <label for="name">Имя</label>
            <input id="name" type="text" placeholder="Имя пользователя" />
          </div>
          
          <div class="field">
            <label for="name">Фамилия</label>
            <input id="name" type="text" placeholder="Фамилия пользователя" />
          </div>

          <div class="field">
            <label for="role">Тип аккаунта</label>
            <select id="role">
              <option>Пользователь</option>
              <option>Организатор</option>
            </select>
          </div>

          <div class="field">
            <label for="email">Электронная почта</label>
            <input id="email" type="email" placeholder="name@example.com" />
          </div>

          <div class="field">
            <label for="password">Пароль</label>
            <input id="password" type="password" placeholder="Создайте пароль" />
            <div class="hint">Не менее 8 символов</div>
          </div>

          <div class="field">
            <label for="password2">Повтор пароля</label>
            <input id="password2" type="password" placeholder="Повторите пароль" />
          </div>
          <div class="terms">
            <label class="check">
              <input type="checkbox" />
              <span>Я принимаю <a href="docs/user-agreement.pdf" target="_blank" rel="noopener noreferrer">Пользовательское соглашение</a>.</span>
            </label>

            <label class="check">
              <input type="checkbox" />
              <span>Я ознакомлен с <a href="docs/privacy-policy.pdf" target="_blank" rel="noopener noreferrer">Политикой обработки персональных данных</a>.</span>
            </label>

            <label class="check">
              <input type="checkbox" />
              <span>Я даю <a href="docs/personal-data-consent.pdf" target="_blank" rel="noopener noreferrer">согласие на обработку персональных данных</a>.</span>
            </label>
          </div>

          <button class="btn btn-primary" type="button">Создать аккаунт</button>
        </form>

        <div class="alt">
          Уже есть аккаунт? <a href="#">Войти</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
